<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:system-ui;margin:0;color:#172033;background:#f5f7f6}.bar{background:#006633;color:#fff;padding:10px 12px;border-radius:10px}.stats{font-size:13px;margin-top:2px}.tools{display:grid;grid-template-columns:1fr auto;gap:7px;margin:7px 0}.tools>*{font-size:16px;padding:9px;min-width:0}.tools input{width:auto}.undo{grid-column:1/-1;min-height:50px;background:#172033;color:#fff;border:0;border-radius:9px;font-size:17px;font-weight:800;touch-action:manipulation}.feedback{display:none;background:#dff5e6;border:2px solid #18753b;border-radius:9px;padding:8px 10px;margin:7px 0;font-weight:800}.feedback.show{display:block}.recent{background:#fff;border:1px solid #cad5ce;border-radius:9px;padding:7px 9px;margin-bottom:7px}.recent-title{font-size:13px;font-weight:800;text-transform:uppercase}.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:5px}.event{background:#eef7f1;border-radius:6px;padding:5px 7px;font-size:12px;overflow:hidden}.event span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event .state{font-weight:700;color:#18753b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:6px}.runner{min-height:58px;border:2px solid #006633;border-radius:9px;background:#fff;text-align:left;padding:7px 9px;touch-action:manipulation}.runner strong{font-size:16px}.runner small{font-size:12px}.runner.captured{background:#dff5e6;border-color:#18753b}.runner:disabled{color:#172033;opacity:1}.captured-at{font-size:11px;color:#18753b;font-weight:700}.failed{color:#b42318}.warning{background:#fff0c2;color:#713f00;padding:7px;border-radius:7px;margin-top:7px}.offline{background:#8b1e16}@media(max-width:520px){.strip{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.runner{min-height:56px}.tools select{max-width:105px}}
</style></head><body><div id="app"></div><script>
let args={}, queue=[], key='', timer=null, clockOffset=0,lastCapturedId='',feedbackTimer=null;
const send=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},'*');
send('streamlit:componentReady',{apiVersion:1});
function persist(){localStorage.setItem(key,JSON.stringify(queue));}
function emit(action='flush'){send('streamlit:setComponentValue',{value:{events:queue.filter(e=>['pending','failed'].includes(e.state)),action,nonce:Date.now()}});}
function resize(){setTimeout(()=>send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8}),10)}
function capture(a){if(queue.some(e=>e.athlete_id===a.id&&!['cancelled'].includes(e.state)))return;let wall=Date.now(),seq=Number(localStorage.getItem(key+':seq')||0)+1;localStorage.setItem(key+':seq',seq);let offset=clockOffset;let corrected=Math.abs(offset)<=10000?wall+offset:wall;let event={client_event_id:crypto.randomUUID(),athlete_id:a.id,race_session_id:args.race_session_id,checkpoint_number:args.checkpoint_number,captured_at:new Date(corrected).toISOString(),client_wall_ms:wall,performance_ms:performance.now(),device_id:args.device_id,capture_sequence:seq,clock_offset_ms:offset,name_snapshot:a.name,bib_snapshot:a.bib,state:'pending'};queue.push(event);lastCapturedId=event.client_event_id;persist();if(navigator.vibrate)navigator.vibrate(25);render();clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>{lastCapturedId='';render()},1400);clearTimeout(timer);timer=setTimeout(()=>emit(),500)}
function undo(){let e=[...queue].reverse().find(x=>!['cancelled'].includes(x.state));if(!e)return;if(e.state==='synced'){emit('undo_synced:'+e.client_event_id);return}e.state='cancelled';e.cancelled_at=new Date().toISOString();persist();render();emit('cancelled')}
function render(){let pending=queue.filter(e=>['pending','failed'].includes(e.state)).length,synced=queue.filter(e=>e.state==='synced').length,skew=clockOffset;let q=(document.querySelector('#find')?.value||'').toLowerCase(),order=document.querySelector('#order')?.value||'bib';let active=queue.filter(e=>e.state!=='cancelled'),captured=new Set(active.map(e=>e.athlete_id)),last=active.find(e=>e.client_event_id===lastCapturedId);let athletes=(args.athletes||[]).filter(a=>(!captured.has(a.id)||a.id===last?.athlete_id)&&(!q||(a.name+' '+a.bib).toLowerCase().includes(q)));athletes.sort((a,b)=>order==='name'?a.name.localeCompare(b.name):order==='roster'?a.roster-b.roster:order==='race'?a.race-b.race:String(a.bib||'999999').localeCompare(String(b.bib||'999999'),undefined,{numeric:true}));let recent=[...active].reverse().slice(0,3);document.querySelector('#app').innerHTML=`<div class="bar ${navigator.onLine?'':'offline'}"><b>${args.checkpoint_label}</b><div class="stats">${active.length} captured · ${pending} queued · ${synced} synchronized ${navigator.onLine?'':'· OFFLINE — saved locally'}</div>${Math.abs(skew)>2000?`<div class="warning">Device clock differs from reference by ${(skew/1000).toFixed(1)} seconds. Verify device time.</div>`:''}</div><div class="feedback ${last?'show':''}">${last?`✓ ${last.bib_snapshot||''} ${last.name_snapshot}<div class="captured-at">Captured ${new Date(last.captured_at).toLocaleTimeString()} · Saved on device</div>`:''}</div><div class="tools"><input id="find" placeholder="Find name or bib"><select id="order"><option value="bib">Bib</option><option value="name">Last name</option><option value="roster">Roster</option><option value="race">Live order</option></select><button class="undo" id="undo">UNDO LAST TAP</button></div><div class="recent"><div class="recent-title">Recent Captures · newest first</div><div class="strip">${recent.map(e=>`<div class="event ${e.state}"><span>✓ ${e.bib_snapshot||''} ${e.name_snapshot}</span><span>${args.checkpoint_label} · ${new Date(e.captured_at).toLocaleTimeString()}</span><span class="state">${e.state==='synced'?'Synchronized':e.state==='failed'?'Retrying':'Saved on device'}</span></div>`).join('')||'<span>No captures yet</span>'}</div></div><div class="grid">${athletes.map(a=>{let done=a.id===last?.athlete_id;return `<button class="runner ${done?'captured':''}" data-id="${a.id}" ${done?'disabled':''}><strong>${done?'✓ ':''}${a.bib? a.bib+' ':''}${a.last.toUpperCase()}</strong><br>${a.first}${done?`<div class="captured-at">Captured ${new Date(last.captured_at).toLocaleTimeString()}</div>`:`<small><br>${a.team||''}</small>`}</button>`}).join('')}</div>`;document.querySelectorAll('.runner:not(.captured)').forEach(b=>b.onclick=()=>capture(args.athletes.find(a=>a.id===b.dataset.id)));document.querySelector('#undo').onclick=undo;document.querySelector('#find').oninput=render;document.querySelector('#order').onchange=render;resize()}
addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;args=e.data.args;clockOffset=args.server_utc_ms-Date.now();key=`kmhs:pack:${args.race_session_id}:${args.checkpoint_number}:${args.device_id}`;try{queue=JSON.parse(localStorage.getItem(key)||'[]')}catch{queue=[]}let ack=new Set(args.ack_ids||[]);queue.forEach(x=>{if(ack.has(x.client_event_id))x.state='synced'});persist();render();if(queue.some(x=>['pending','failed'].includes(x.state)))setTimeout(()=>emit(),700)});
addEventListener('online',()=>{render();emit()});addEventListener('offline',render);setInterval(()=>{if(navigator.onLine&&queue.some(x=>['pending','failed'].includes(x.state)))emit()},3000);
</script></body></html>
