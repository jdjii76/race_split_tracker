</style></head><body><div id="app"></div><script>
const STORE='kmhs:race-day:queue',DEVICE='kmhs:race-day:device',CONTEXT='kmhs:race-day:context',VERSION=2,RETENTION=7*24*3600*1000;
let args={},queue=[],timer=null,clockOffset=0,lastCapturedId='',feedbackTimer=null,expectedOrder=[],displayMode='expected',recovering=false,hadConnectionProblem=false,lastEmit=0;
const send=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},'*'); send('streamlit:componentReady',{apiVersion:1});
function durableDevice(){let id=localStorage.getItem(DEVICE);if(!id){id=crypto.randomUUID();localStorage.setItem(DEVICE,id)}return id}
function readStore(){let parsed;try{parsed=JSON.parse(localStorage.getItem(STORE)||'null')}catch{};if(parsed&&parsed.version===VERSION&&Array.isArray(parsed.events))return parsed.events;let merged=[];for(let i=0;i<localStorage.length;i++){let key=localStorage.key(i);if(key&&key.startsWith('kmhs:pack:')&&!key.endsWith(':seq')&&!key.endsWith(':expected-order')&&!key.endsWith(':display-mode'))try{let old=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(old))merged.push(...old)}catch{}}return merged}
function persist(){let other=readStore().filter(e=>e&&e.race_session_id!==args.race_session_id),unique=new Map([...other,...queue.filter(Boolean)].map(e=>[e.client_event_id,e]));queue=[...unique.values()].filter(e=>e.race_session_id===args.race_session_id);localStorage.setItem(STORE,JSON.stringify({version:VERSION,events:[...unique.values()],updated_at:new Date().toISOString()}));}
function restoreQueue(){let device=durableDevice(),merged=new Map();for(let event of readStore()){if(event&&event.client_event_id){event={event_type:'split',capture_type:'pack',retry_count:0,server_acknowledged:false,...event,device_id:event.device_id||device};merged.set(event.client_event_id,event)}}queue=[...merged.values()].filter(e=>e.race_session_id===args.race_session_id);persist();let key=STORE,legacy=[];for(let i=0;i<localStorage.length;i++){let source=localStorage.key(i);if(source&&source.startsWith('kmhs:pack:')&&!source.endsWith(':seq')&&!source.endsWith(':expected-order')&&!source.endsWith(':display-mode'))legacy.push(source)}for(let source of legacy)if(source!==key)localStorage.removeItem(source);console.info('RaceDay queue recovery',{count:queue.length,session:args.race_session_id})}
function saveContext(active=true){localStorage.setItem(CONTEXT,JSON.stringify({version:VERSION,timing_mode_active:active,operator_type:args.operator_type||'timer',race_session_id:args.race_session_id,race_id:args.race_id,checkpoint_number:args.checkpoint_number,device_id:durableDevice(),last_active_at:new Date().toISOString()}))}
function emit(action='flush'){let now=Date.now();if(action==='reconnect_retry'&&now-lastEmit<2500)return;lastEmit=now;let events=queue.filter(e=>['pending','failed'].includes(e.state)).sort((a,b)=>(a.capture_sequence||0)-(b.capture_sequence||0)||a.captured_at.localeCompare(b.captured_at));events.forEach(e=>{e.last_sync_attempt=new Date().toISOString();e.retry_count=(e.retry_count||0)+1});persist();console.info('RaceDay sync attempt',{count:events.length});send('streamlit:setComponentValue',{value:{events,action,nonce:now,device_id:durableDevice(),pending_count:events.length,context:JSON.parse(localStorage.getItem(CONTEXT)||'null')}})}
function resize(){setTimeout(()=>send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8}),10)}
function formatElapsed(value){let total=Math.max(0,Math.round(Number(value)||0)),minutes=Math.floor(total/60),seconds=String(total%60).padStart(2,'0');return `${minutes}:${seconds}`}
function capture(a){if(queue.some(e=>e.athlete_id===a.id&&e.checkpoint_number===(a.checkpoint_number||args.checkpoint_number)&&!['cancelled'].includes(e.state)))return;let wall=Date.now(),device=durableDevice(),seq=Number(localStorage.getItem(STORE+':seq')||0)+1;localStorage.setItem(STORE+':seq',seq);let offset=clockOffset,corrected=Math.abs(offset)<=10000?wall+offset:wall;let event={client_event_id:crypto.randomUUID(),event_uuid:null,athlete_id:a.id,race_session_id:args.race_session_id,checkpoint_number:a.checkpoint_number||args.checkpoint_number,captured_at:new Date(corrected).toISOString(),client_wall_ms:wall,performance_ms:performance.now(),device_id:device,capture_sequence:seq,clock_offset_ms:offset,event_type:'split',capture_type:args.capture_type||'pack',state:'pending',retry_count:0,last_sync_attempt:null,server_acknowledged:false,name_snapshot:a.name,bib_snapshot:a.bib};event.event_uuid=event.client_event_id;queue.push(event);lastCapturedId=event.client_event_id;persist();console.info('RaceDay event captured locally',{event_id:event.client_event_id});if(navigator.vibrate)navigator.vibrate(25);render();clearTimeout(feedbackTimer);feedbackTimer=setTimeout(()=>{lastCapturedId='';render()},1400);clearTimeout(timer);timer=setTimeout(()=>emit(),500)}
function undo(){let e=[...queue].reverse().find(x=>!['cancelled','undo_pending'].includes(x.state));if(!e)return;if(e.state==='synced'){e.state='undo_pending';persist();render();emit('undo_synced:'+e.client_event_id);return}e.state='cancelled';e.cancelled_at=new Date().toISOString();persist();render();emit('cancelled')}
function render(){let pending=queue.filter(e=>['pending','failed'].includes(e.state)).length,synced=queue.filter(e=>e.state==='synced').length,failures=Number(args.consecutive_sync_failures||0),offline=!navigator.onLine||Boolean(args.sync_error),degraded=navigator.onLine&&failures>=2;if(offline||degraded)hadConnectionProblem=true;if(!pending)recovering=false;let q=(document.querySelector('#find')?.value||'').toLowerCase(),mode=document.querySelector('#mode')?.value||displayMode,status=document.querySelector('#status')?.value||'all',active=queue.filter(e=>!['cancelled','undo_pending'].includes(e.state)),byAthlete=new Map(active.map(e=>[e.athlete_id,e])),last=active.find(e=>e.client_event_id===lastCapturedId),athletes=(args.athletes||[]).filter(a=>(!q||(a.name+' '+a.bib).toLowerCase().includes(q))&&(status==='all'||status==='remaining'&&!byAthlete.has(a.id)||status==='captured'&&byAthlete.has(a.id)));displayMode=mode;if(mode==='expected'&&!expectedOrder.length){expectedOrder=(args.athletes||[]).map(a=>a.id);localStorage.setItem(STORE+':expected-order',JSON.stringify(expectedOrder))}let expectedPosition=new Map(expectedOrder.map((id,index)=>[id,index]));athletes.sort((a,b)=>mode==='expected'?(expectedPosition.get(a.id)??Infinity)-(expectedPosition.get(b.id)??Infinity)||a.roster-b.roster:a.roster-b.roster);let recent=[...active].reverse().slice(0,3),lastSync=args.last_successful_sync_at?new Date(args.last_successful_sync_at).toLocaleTimeString():'Never',connection=offline?`<div class="offline-banner">OFFLINE — timing is continuing on this device.<small>${pending} locally queued / unsynchronized captures<br>DO NOT REFRESH OR CLOSE THIS PAGE WHILE OFFLINE.<br>Events are nevertheless durable across refresh, lock, and reconnect.</small></div>`:degraded?`<div class="degraded">Connection problem · ${pending} saved on this device<small><br>Last successful sync: ${lastSync}</small></div>`:recovering&&pending?`<div class="recovering">Connection restored — synchronizing...<br>Online · Syncing ${pending}</div>`:`<div class="synchronized">Online · All synced<br><small>Synchronized · ${pending} queued · ${synced} synchronized · Last sync ${lastSync}</small></div>`;document.querySelector('#app').innerHTML=`${connection}<div class="bar"><b>${args.checkpoint_label}</b><div class="stats">${active.length} captured · ${pending} queued · ${synced} synchronized</div></div><div class="feedback ${last?'show':''}">${last?`✓ ${last.bib_snapshot||''} ${last.name_snapshot}<div class="captured-at">Captured ${new Date(last.captured_at).toLocaleTimeString()} · Saved on device</div>`:''}</div><div class="tools"><input id="find" placeholder="Find name or bib"><select id="mode"><option value="expected">Expected Arrival Order</option><option value="stable">Stable Roster</option></select><select id="status"><option value="all">All Athletes</option><option value="remaining">Remaining Only</option><option value="captured">Captured Only</option></select><button class="sync-now" id="sync" ${pending?'':'disabled'}>Sync Now (${pending})</button><button class="undo" id="undo">UNDO LAST TAP</button></div><div class="recent"><div class="recent-title">Recent Captures · newest first</div><div class="strip">${recent.map(e=>`<div class="event"><span>✓ ${e.bib_snapshot||''} ${e.name_snapshot}</span><span>${new Date(e.captured_at).toLocaleTimeString()}</span><span class="state">${e.state==='synced'?'Synchronized':e.state==='failed'?'Retrying':'Saved on device'}</span></div>`).join('')||'No captures yet'}</div></div><div class="grid">${athletes.map(a=>{let event=byAthlete.get(a.id),done=Boolean(event),enabled=a.eligible&&!done,missing=mode==='expected'&&a.missing_previous&&!done;return `<button class="runner ${done?'captured':missing?'missing':enabled?'':'waiting'}" data-id="${a.id}" ${enabled?'':'disabled'}><strong>${done?'✓ ':''}${missing?'🔴 ':''}${a.name}</strong>${a.bib?`<div class="card-meta">Bib ${a.bib}</div>`:''}${done?`<div class="captured-at">Captured ${new Date(event.captured_at).toLocaleTimeString()} · ${event.state==='synced'?'Synchronized':'Saved on device'}</div>`:missing?`<div class="missing-note">Missing ${a.missing_label}</div>${a.latest_checkpoint_time!=null?`<div class="previous-split">Latest: ${a.latest_checkpoint_label} — ${formatElapsed(a.latest_checkpoint_time)}</div>`:''}`:a.arrival_time!=null?`<div class="previous-split">Previous Split: ${a.previous_label} — ${formatElapsed(a.arrival_time)}</div>`:''}</button>`}).join('')}</div>`;document.querySelectorAll('.runner:not(:disabled)').forEach(b=>b.onclick=()=>capture(args.athletes.find(a=>a.id===b.dataset.id)));document.querySelector('#sync').onclick=()=>{recovering=true;render();emit('sync_now')};document.querySelector('#undo').onclick=undo;document.querySelector('#find').oninput=render;document.querySelector('#mode').onchange=e=>{displayMode=e.target.value;render()};document.querySelector('#status').onchange=render;resize()}
addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;args=e.data.args;clockOffset=args.server_utc_ms-Date.now();restoreQueue();saveContext(true);try{expectedOrder=JSON.parse(localStorage.getItem(STORE+':expected-order')||'[]')}catch{expectedOrder=[]}let ack=new Set(args.ack_ids||[]),voided=new Set(args.void_ids||[]);queue.forEach(x=>{if(voided.has(x.client_event_id))x.state='cancelled';else if(ack.has(x.client_event_id))x.state='synced';if(ack.has(x.client_event_id)){x.server_acknowledged=true;x.acknowledged_at=new Date().toISOString()}});if(hadConnectionProblem&&!args.sync_error&&queue.some(x=>['pending','failed'].includes(x.state)))recovering=true;persist();render();if(queue.some(x=>['pending','failed'].includes(x.state)))setTimeout(()=>emit('component_ready'),100)});
function retryQueued(){restoreQueue();saveContext(true);if(queue.some(x=>['pending','failed'].includes(x.state))){recovering=true;render();emit('reconnect_retry')}}
addEventListener('online',retryQueued);addEventListener('focus',retryQueued);addEventListener('pageshow',retryQueued);addEventListener('pagehide',()=>saveContext(true));document.addEventListener('visibilitychange',()=>{saveContext(true);if(document.visibilityState==='visible')retryQueued()});addEventListener('offline',()=>{hadConnectionProblem=true;render()});addEventListener('beforeunload',e=>{if(queue.some(x=>['pending','failed'].includes(x.state))){e.preventDefault();e.returnValue=''}});setInterval(retryQueued,3000);
</script></body></html>
