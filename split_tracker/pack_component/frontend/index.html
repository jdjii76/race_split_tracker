<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:system-ui;margin:0;color:#172033}.bar{background:#48106a;color:#fff;padding:12px;border-radius:12px}.stats{font-size:14px}.tools{display:flex;gap:8px;margin:9px 0}.tools>*{font-size:16px;padding:9px;min-width:0}.tools input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px}.runner{min-height:76px;border:2px solid #6b2d85;border-radius:12px;background:#fff;text-align:left;padding:10px;touch-action:manipulation}.runner strong{font-size:19px}.runner.captured{background:#dff5e6;border-color:#18753b}.strip{margin-top:10px;max-height:260px;overflow:auto}.event{display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #ddd;font-size:13px}.failed{color:#b42318}.warning{background:#fff0c2;color:#713f00;padding:7px;border-radius:7px;margin-top:7px}.offline{background:#8b1e16}.undo{background:#fff;border:0;border-radius:8px;padding:8px;font-weight:700}
</style></head><body><div id="app"></div><script>
let args={}, queue=[], key='', timer=null, clockOffset=0;
const send=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},'*');
send('streamlit:componentReady',{apiVersion:1});
function persist(){localStorage.setItem(key,JSON.stringify(queue));}
function emit(action='flush'){send('streamlit:setComponentValue',{value:{events:queue.filter(e=>['pending','failed'].includes(e.state)),action,nonce:Date.now()}});}
function resize(){setTimeout(()=>send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8}),10)}
function capture(a){if(queue.some(e=>e.athlete_id===a.id&&!['cancelled'].includes(e.state)))return;let wall=Date.now(),seq=Number(localStorage.getItem(key+':seq')||0)+1;localStorage.setItem(key+':seq',seq);let offset=clockOffset;let corrected=Math.abs(offset)<=10000?wall+offset:wall;queue.push({client_event_id:crypto.randomUUID(),athlete_id:a.id,race_session_id:args.race_session_id,checkpoint_number:args.checkpoint_number,captured_at:new Date(corrected).toISOString(),client_wall_ms:wall,performance_ms:performance.now(),device_id:args.device_id,capture_sequence:seq,clock_offset_ms:offset,name_snapshot:a.name,bib_snapshot:a.bib,state:'pending'});persist();if(navigator.vibrate)navigator.vibrate(25);render();clearTimeout(timer);timer=setTimeout(()=>emit(),500)}
function undo(){let e=[...queue].reverse().find(x=>!['cancelled'].includes(x.state));if(!e)return;if(e.state==='synced'){emit('undo_synced:'+e.client_event_id);return}e.state='cancelled';e.cancelled_at=new Date().toISOString();persist();render();emit('cancelled')}
function render(){let pending=queue.filter(e=>['pending','failed'].includes(e.state)).length,synced=queue.filter(e=>e.state==='synced').length,skew=clockOffset;let q=(document.querySelector('#find')?.value||'').toLowerCase(),order=document.querySelector('#order')?.value||'bib';let captured=new Set(queue.filter(e=>e.state!=='cancelled').map(e=>e.athlete_id));let athletes=(args.athletes||[]).filter(a=>!captured.has(a.id)&&(!q||(a.name+' '+a.bib).toLowerCase().includes(q)));athletes.sort((a,b)=>order==='name'?a.name.localeCompare(b.name):order==='roster'?a.roster-b.roster:order==='race'?a.race-b.race:String(a.bib||'999999').localeCompare(String(b.bib||'999999'),undefined,{numeric:true}));document.querySelector('#app').innerHTML=`<div class="bar ${navigator.onLine?'':'offline'}"><b>PACK MODE — ${args.checkpoint_label}</b><div class="stats">${queue.filter(e=>e.state!=='cancelled').length} captured · ${pending} queued · ${synced} synchronized ${navigator.onLine?'':'· OFFLINE — saved locally'}</div>${Math.abs(skew)>2000?`<div class="warning">Device clock differs from reference by ${(skew/1000).toFixed(1)} seconds. Verify device time.</div>`:''}</div><div class="tools"><input id="find" placeholder="Find name or bib"><select id="order"><option value="bib">Bib</option><option value="name">Last name</option><option value="roster">Roster</option><option value="race">Live order</option></select><button class="undo" id="undo">↶ Undo Last Pack Tap</button></div><div class="grid">${athletes.map(a=>`<button class="runner" data-id="${a.id}"><strong>${a.bib? a.bib+' — ':''}${a.last.toUpperCase()}</strong><br>${a.first}<small><br>${a.team||''}</small></button>`).join('')}</div><b>PACK CAPTURES</b><div class="strip">${[...queue].filter(e=>e.state!=='cancelled').reverse().slice(0,10).map(e=>`<div class="event ${e.state}"><span>${new Date(e.captured_at).toISOString().slice(11,23)} — ${e.bib_snapshot||''} ${e.name_snapshot}</span><span>${e.state}</span></div>`).join('')}</div>`;document.querySelectorAll('.runner').forEach(b=>b.onclick=()=>capture(args.athletes.find(a=>a.id===b.dataset.id)));document.querySelector('#undo').onclick=undo;document.querySelector('#find').oninput=render;document.querySelector('#order').onchange=render;resize()}
addEventListener('message',e=>{if(e.data.type!=='streamlit:render')return;args=e.data.args;clockOffset=args.server_utc_ms-Date.now();key=`kmhs:pack:${args.race_session_id}:${args.checkpoint_number}:${args.device_id}`;try{queue=JSON.parse(localStorage.getItem(key)||'[]')}catch{queue=[]}let ack=new Set(args.ack_ids||[]);queue.forEach(x=>{if(ack.has(x.client_event_id))x.state='synced'});persist();render();if(queue.some(x=>['pending','failed'].includes(x.state)))setTimeout(()=>emit(),700)});
addEventListener('online',()=>{render();emit()});addEventListener('offline',render);setInterval(()=>{if(navigator.onLine&&queue.some(x=>['pending','failed'].includes(x.state)))emit()},3000);
</script></body></html>
